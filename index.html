<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goody Tech Telecom - Login & Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #ffffff; width: 100%; max-width: 400px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        h2 { text-align: center; margin-bottom: 5px; color: #0056b3; }
        .subtitle { text-align: center; margin-bottom: 25px; color: #666; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .toggle-text { text-align: center; margin-top: 15px; font-size: 14px; color: #666; }
        .toggle-btn { color: #0056b3; font-weight: bold; cursor: pointer; }
        #register-form { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Form -->
        <div id="login-form">
            <h2>Goody Tech Telecom</h2>
            <p class="subtitle">Your number one plug for instant data & airtime.</p>
            
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>
            <button type="button" onclick="login()">Log In</button>
            <p class="toggle-text">Don't have an account? <span class="toggle-btn" onclick="toggleForms()">Register here</span></p>
        </div>

        <!-- Registration Form -->
        <div id="register-form">
            <h2>Join Goody Tech Telecom</h2>
            <p class="subtitle">Create an account to get started.</p>

            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Create a password" required>
            </div>
            <button type="button" onclick="register()">Sign Up</button>
            <p class="toggle-text">Already have an account? <span class="toggle-btn" onclick="toggleForms()">Log in here</span></p>
        </div>
    </div>

    <script>
        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            registerForm.style.display = registerForm.style.display === 'none' ? 'block' : 'none';
        }

        function login() {
            window.location.href = "dashboard.html";
        }

        function register() {
            alert("Account created! Redirecting to Dashboard...");
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
