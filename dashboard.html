<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Goody Tech Telecom</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; padding: 20px; }
        .header { background: #0056b3; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .wallet-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; text-align: center; }
        .wallet-card h3 { color: #888; font-size: 13px; letter-spacing: 1px; margin-bottom: 8px; }
        .wallet-card h1 { color: #0056b3; font-size: 32px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { background: white; border: 1px solid #e0e0e0; padding: 20px; border-radius: 10px; text-align: center; font-weight: bold; color: #333; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-fund { background: #0056b3; color: white; border: none; grid-column: span 2; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Goody Tech Telecom</h2>
        <p>Welcome, User!</p>
    </div>

    <div class="wallet-card">
        <h3>WALLET BALANCE</h3>
        <h1>₦0.00</h1>
    </div>

    <div class="grid">
        <button class="btn btn-fund" onclick="alert('Virtual account payment gateway integration coming next!')">+ Fund Wallet</button>
        <button class="btn" onclick="alert('Buy Data menu clicked!')">📱 Buy Data</button>
        <button class="btn" onclick="alert('Buy Airtime menu clicked!')">📞 Buy Airtime</button>
        <button class="btn" onclick="alert('Pay Electricity menu clicked!')">💡 Pay Electricity</button>
        <button class="btn" onclick="alert('Cable TV menu clicked!')">📺 Cable TV</button>
    </div>

</body>
</html>
