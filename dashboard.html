<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Goody Tech Telecom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <div class="dash-header">
        <div class="logo-text" style="font-size: 20px; margin-bottom: 0;">GOODY TECH <span>TELECOM</span></div>
        <p id="user-name-display" style="font-size: 14px; font-weight: 600; color: #8f8f9d;">User</p>
    </div>

    <div class="wallet-card">
        <h3>WALLET BALANCE</h3>
        <h1>₦0.00</h1>
        <div class="acc-info">Wema Bank: 8012345678</div>
    </div>

    <div class="grid">
        <button class="btn btn-fund" onclick="openModal('fund-modal')">+ Fund Wallet</button>
        <button class="btn" onclick="openModal('data-type-modal')">📱 Buy Data</button>
        <button class="btn" onclick="alert('Airtime loading...')">📞 Buy Airtime</button>
        <button class="btn" onclick="alert('Bills loading...')">💡 Pay Bills</button>
        <button class="btn" onclick="alert('Cable loading...')">📺 Cable TV</button>
    </div>

    <!-- DATA TYPE SELECTION MODAL (Exactly like Screenshot 2) -->
    <div id="data-type-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Choose Data Type</div>
            <div class="radio-list">
                <div class="radio-item" onclick="selectDataType('SME')">
                    <span>SME</span>
                    <input type="radio" name="dtype" checked>
                </div>
                <div class="radio-item" onclick="selectDataType('SME Plus')">
                    <span>SME Plus</span>
                    <input type="radio" name="dtype">
                </div>
                <div class="radio-item" onclick="selectDataType('SME2')">
                    <span>SME2</span>
                    <input type="radio" name="dtype">
                </div>
                <div class="radio-item" onclick="selectDataType('POS Special Data')">
                    <span>POS Special Data</span>
                    <input type="radio" name="dtype">
                </div>
                <div class="radio-item" onclick="selectDataType('Gifting')">
                    <span>Gifting</span>
                    <input type="radio" name="dtype">
                </div>
                <div class="radio-item" onclick="selectDataType('Awoof')">
                    <span>Awoof</span>
                    <input type="radio" name="dtype">
                </div>
                <div class="radio-item" onclick="selectDataType('DataShare')">
                    <span>DataShare</span>
                    <input type="radio" name="dtype">
                </div>
            </div>
            <button class="auth-btn" onclick="closeModal('data-type-modal')">Close</button>
        </div>
    </div>

    <!-- FUND WALLET MODAL -->
    <div id="fund-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Fund Wallet</div>
            <p style="color: #a0a0ab; font-size: 14px; margin-bottom: 20px;">Transfer to your dedicated virtual account:</p>
            <div style="background: #25252c; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                <p style="margin-bottom: 8px;"><strong>Bank:</strong> Wema Bank</p>
                <p style="margin-bottom: 8px;"><strong>Account:</strong> 8012345678</p>
                <p><strong>Name:</strong> Goody Tech Telecom</p>
            </div>
            <button class="auth-btn" onclick="closeModal('fund-modal')">Close</button>
        </div>
    </div>

    <!-- Floating WhatsApp Widget -->
    <a href="https://wa.me/" target="_blank" class="whatsapp-float">
        <svg viewBox="0 0 32 32"><path d="M16 2a13.9 13.9 0 0 0-11.8 21.2L2 30l7-1.8A13.9 13.9 0 1 0 16 2zm0 25.5a11.5 11.5 0 0 1-5.9-1.6l-.4-.2-4.4 1.1 1.2-4.3-.3-.4A11.6 11.6 0 1 1 16 27.5z"/></svg>
    </a>

    <script src="script.js"></script>
</body>
</html>
