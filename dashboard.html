<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Goody Tech Telecom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <div class="header">
        <h2>Goody Tech Telecom</h2>
        <p id="user-name-display">Welcome, User!</p>
    </div>

    <div class="wallet-card">
        <h3>WALLET BALANCE</h3>
        <h1>₦0.00</h1>
    </div>

    <div class="grid">
        <button class="btn btn-fund" onclick="serviceClicked('Fund Wallet')">+ Fund Wallet</button>
        <button class="btn" onclick="serviceClicked('Buy Data')">📱 Buy Data</button>
        <button class="btn" onclick="serviceClicked('Buy Airtime')">📞 Buy Airtime</button>
        <button class="btn" onclick="serviceClicked('Pay Electricity')">💡 Pay Electricity</button>
        <button class="btn" onclick="serviceClicked('Cable TV')">📺 Cable TV</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
